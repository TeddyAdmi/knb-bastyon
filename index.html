<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>КНБ 1 PKOIN</title>
  <!-- Подключаем Bastyon SDK -->
  <script src="https://bastyon.com/js/lib/apps/sdk.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #2a2a2a;
      padding: 24px;
      border-radius: 12px;
      text-align: center;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h1 { margin-top: 0; font-size: 22px; color: #00a4ff; }
    .badge {
      background: #ff9800;
      color: #000;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 15px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 20px 0;
    }
    button {
      background: #333;
      border: 2px solid #00a4ff;
      color: white;
      font-size: 28px;
      padding: 12px 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background 0.2s;
    }
    button:hover { background: #00a4ff; transform: scale(1.05); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #status { margin-top: 15px; font-size: 14px; color: #aaa; min-height: 40px; }
    #user-info { font-size: 12px; color: #888; margin-bottom: 15px; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🎮 Комната КНБ</h1>
    <div class="badge">Ставка: 1 PKOIN</div>
    <div id="user-info">Подключение к Bastyon...</div>

    <p>Выберите ваш ход:</p>
    <div class="btn-group">
      <button onclick="play('rock')" id="btn-rock">🪨</button>
      <button onclick="play('paper')" id="btn-paper">📄</button>
      <button onclick="play('scissors')" id="btn-scissors">✂️</button>
    </div>

    <div id="status">Ожидание выбора хода...</div>
  </div>

  <script>
    let make = null;
    let userAddress = '';

    window.addEventListener('load', () => {
      if (window.make) {
        make = new window.make();
        make.init()
          .then(() => make.get.account())
          .then(account => {
            userAddress = account.address;
            document.getElementById('user-info').innerText = 'Игрок: ' + userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
          })
          .catch(err => {
            document.getElementById('user-info').innerText = 'Режим без авторизации';
          });
      } else {
        document.getElementById('user-info').innerText = 'Запущено вне Bastyon';
      }
    });

    async function play(playerChoice) {
      const statusEl = document.getElementById('status');
      setButtonsEnabled(false);

      try {
        if (make) {
          statusEl.innerText = 'Подтвердите транзакцию 1 PKOIN...';
          await make.payment({
            amount: 1,
            currency: 'PKOIN',
            address: 'PK...Ваш_Адрес_Кошелька' // Замените на ваш PKOIN-адрес
          });
        }

        statusEl.innerText = 'Ставка принята! Соперник делает ход...';

        setTimeout(() => {
          const choices = ['rock', 'paper', 'scissors'];
          const botChoice = choices[Math.floor(Math.random() * choices.length)];
          
          const names = { rock: '🪨 Камень', paper: '📄 Бумага', scissors: '✂️ Ножницы' };
          let resultText = `Вы: ${names[playerChoice]} vs Соперник: ${names[botChoice]}.<br>`;

          if (playerChoice === botChoice) {
            resultText += '<b>Ничья! Ставка возвращается.</b>';
          } else if (
            (playerChoice === 'rock' && botChoice === 'scissors') ||
            (playerChoice === 'paper' && botChoice === 'rock') ||
            (playerChoice === 'scissors' && botChoice === 'paper')
          ) {
            resultText += '<b style="color:#4caf50;">Вы выиграли! 🎉</b>';
          } else {
            resultText += '<b style="color:#f44336;">Вы проиграли. 😞</b>';
          }

          statusEl.innerHTML = resultText;
          setButtonsEnabled(true);
        }, 1200);

      } catch (err) {
        statusEl.innerHTML = '<span style="color:#f44336;">Ошибка оплаты или отмена транзакции</span>';
        setButtonsEnabled(true);
      }
    }

    function setButtonsEnabled(enabled) {
      document.getElementById('btn-rock').disabled = !enabled;
      document.getElementById('btn-paper').disabled = !enabled;
      document.getElementById('btn-scissors').disabled = !enabled;
    }
  </script>
</body>
</html>
